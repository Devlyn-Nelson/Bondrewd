[package]
name = "bondrewd"
version = "0.4.0-alpha.0"
edition = "2024"
description = "Bit-level field packing with proc_macros"
license = "MIT OR Apache-2.0"

[workspace]
members = ["derive"]

[dependencies]
bondrewd-derive = { path = "derive", version = "0.6.0-alpha.0", optional = true }

[features]
default = ["derive", "std"]
derive = ["dep:bondrewd-derive"]
alloc = []
std = ["alloc", "bondrewd-derive?/std"]
# Kept so manifests written for bondrewd 0.3 (`features = ["full"]`) still resolve.
full = ["derive", "std"]
