[package]
name = "bondrewd-derive"
version = "0.6.0-alpha.1"
edition = "2024"
description = "Derive macros for bondrewd: bit-level field packing"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[features]
default = ["std"]
# No effect; kept so manifests written for bondrewd-derive 0.5 still resolve.
std = []
